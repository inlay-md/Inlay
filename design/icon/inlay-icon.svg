<!-- Inlay app icon master. 1024x1024 canvas; the squircle is 824x824 on Apple's macOS icon grid. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Inlay app icon: a page with a dark chart tile set into it</title>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263241"/>
      <stop offset="1" stop-color="#10161E"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000000" opacity="0.4" filter="url(#blur)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ground)"/>
  <g transform="translate(100 100) scale(0.8046875)">
    <rect x="232" y="168" width="560" height="688" rx="44" fill="#F7F8FA"/>
    <rect x="304" y="256" width="416" height="30" rx="15" fill="#C5CCD6"/>
    <rect x="304" y="326" width="320" height="30" rx="15" fill="#C5CCD6"/>
    <rect x="304" y="396" width="368" height="30" rx="15" fill="#C5CCD6"/>
    <rect x="304" y="476" width="416" height="300" rx="28" fill="#141A22"/>
    <rect x="308" y="480" width="408" height="292" rx="26" fill="none" stroke="#E0A83A" stroke-width="8"/>
    <rect x="372" y="640" width="60" height="96" rx="8" fill="#E0A83A"/>
    <rect x="482" y="570" width="60" height="166" rx="8" fill="#E0A83A"/>
    <rect x="592" y="608" width="60" height="128" rx="8" fill="#5FC9C0"/>
  </g>
</svg>
