packages:
  - packages/*
  - fixtures

allowBuilds:
  esbuild: true

# One Markdown parser for every surface: Milkdown's remark is pinned to md-render's versions (ADR-0004).
overrides:
  remark-parse: 11.0.0
  remark-stringify: 11.0.0
  remark-gfm: 4.0.1
  remark-math: 6.0.0
  remark-frontmatter: 5.0.0
  unified: 11.0.5
